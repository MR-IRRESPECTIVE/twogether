name: Keep Render Backend Alive

on:
  schedule:
    # Run every 12 minutes to keep the Render free tier service awake
    - cron: "3,15,27,39,51 * * * *"
  workflow_dispatch:
    # Allow manual triggering from the GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          echo "Pinging Twogether Render Backend..."
          curl --fail --retry 4 --retry-delay 5 --retry-all-errors --max-time 120 https://twogether-jic2.onrender.com/health
          echo -e "\nSuccessfully reached health endpoint!"

